<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTrack — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo"><img src="/img/logo.png" alt="TeamTrack Logo">TeamTrack</div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="active" id="nav-dashboard">📊 Dashboard</a>
      </nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <h1 class="page-title" id="page-title">Dashboard</h1>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Projects -->
      <div class="section-header">
        <h2>Your Projects</h2>
        <button class="btn btn-primary btn-sm" onclick="openModal('project-modal')">+ New Project</button>
      </div>
      <div class="projects-grid" id="projects-grid">
        <div class="spinner"></div>
      </div>

      <!-- Recent Tasks -->
      <div class="section-header" style="margin-top:2rem">
        <h2>My Recent Tasks</h2>
      </div>
      <div id="recent-tasks"></div>
    </main>
  </div>

  <!-- Create Project Modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <h3>Create Project</h3>
      <form onsubmit="createProject(event)">
        <div class="form-group">
          <label for="proj-name">Project Name</label>
          <input type="text" id="proj-name" required placeholder="My Awesome Project">
        </div>
        <div class="form-group">
          <label for="proj-desc">Description</label>
          <textarea id="proj-desc" rows="3" placeholder="Brief description..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('project-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">☀️</button>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
