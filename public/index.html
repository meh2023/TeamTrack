<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — Project management with role-based access control">
  <title>TaskFlow — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" id="auth-card">
      <div class="logo">⚡ TaskFlow</div>
      <p class="subtitle">Manage projects, assign tasks, track progress.</p>

      <div class="auth-tabs">
        <button class="active" id="tab-login" onclick="showTab('login')">Login</button>
        <button id="tab-signup" onclick="showTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <div class="error-msg" id="login-error"></div>
        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required placeholder="Min 6 characters" minlength="6">
        </div>
        <div class="error-msg" id="signup-error"></div>
        <button type="submit" class="btn btn-primary" id="signup-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
