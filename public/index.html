<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TeamTrack — Manage your team's workflow effortlessly">
  <title>TeamTrack — Manage Projects Better</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="landing-nav">
    <div class="logo"><img src="/img/logo.png" alt="TeamTrack Logo">TeamTrack</div>

  <header class="landing-hero">
    <div class="hero-content">
      <h1 class="hero-title">Manage projects. Without the noise.</h1>

        <a href="/login.html?tab=signup" class="btn btn-secondary">Sign Up</a>
