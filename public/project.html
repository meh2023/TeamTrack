<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTrack — Project</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo">⚡ TeamTrack</div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" id="nav-dashboard">📊 Dashboard</a>
      </nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <main class="main-content">
      <a href="/dashboard.html" class="back-link">← Back to Dashboard</a>

      <div id="project-header" style="margin-bottom:1.5rem">
        <div class="spinner"></div>
      </div>

      <!-- Kanban Board -->
      <div class="section-header">
        <h2>Tasks</h2>
        <button class="btn btn-primary btn-sm" id="add-task-btn" onclick="openModal('task-modal')">+ Add Task</button>
      </div>
      <div class="kanban" id="kanban">
        <div class="kanban-col col-todo" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'TODO')">
          <div class="kanban-col-header"><span class="dot"></span>To Do<span class="count" id="count-todo">0</span></div>
          <div id="col-todo-tasks"></div>
        </div>
        <div class="kanban-col col-progress" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'IN_PROGRESS')">
          <div class="kanban-col-header"><span class="dot"></span>In Progress<span class="count" id="count-progress">0</span></div>
          <div id="col-progress-tasks"></div>
        </div>
        <div class="kanban-col col-done" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'DONE')">
          <div class="kanban-col-header"><span class="dot"></span>Done<span class="count" id="count-done">0</span></div>
          <div id="col-done-tasks"></div>
        </div>
      </div>

      <!-- Members Section (Admin Only) -->
      <div id="members-section" style="display:none">
        <div class="section-header">
          <h2>Members</h2>
          <button class="btn btn-secondary btn-sm" onclick="openModal('member-modal')">+ Add Member</button>
        </div>
        <div class="members-list" id="members-list"></div>
      </div>
    </main>
  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <h3 id="task-modal-title">Add Task</h3>
      <form onsubmit="saveTask(event)">
        <input type="hidden" id="task-edit-id">
        <div class="form-group">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" required placeholder="Task title">
        </div>
        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" rows="2" placeholder="Optional description"></textarea>
        </div>
        <div class="form-group">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="task-assignee">Assignee</label>
          <select id="task-assignee"><option value="">Unassigned</option></select>
        </div>
        <div class="form-group">
          <label for="task-due">Due Date</label>
          <input type="date" id="task-due">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div class="modal-overlay" id="member-modal">
    <div class="modal">
      <h3>Add Member</h3>
      <form onsubmit="addMember(event)">
        <div class="form-group">
          <label for="member-email">Email Address</label>
          <input type="email" id="member-email" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label for="member-role">Role</label>
          <select id="member-role">
            <option value="MEMBER">Member</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('member-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Project Modal -->
  <div class="modal-overlay" id="edit-project-modal">
    <div class="modal">
      <h3>Edit Project</h3>
      <form onsubmit="updateProject(event)">
        <div class="form-group">
          <label for="edit-proj-name">Project Name</label>
          <input type="text" id="edit-proj-name" required>
        </div>
        <div class="form-group">
          <label for="edit-proj-desc">Description</label>
          <textarea id="edit-proj-desc" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" onclick="deleteProject()">Delete Project</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('edit-project-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">☀️</button>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/project.js"></script>
</body>
</html>
